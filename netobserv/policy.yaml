# OpenShell sandbox policy — goose desktop-agent sandbox
# Reference: https://docs.nvidia.com/openshell/v0.1.8/how-it-works/policies/overview
#
# Posture:
#   - Filesystem: sandbox working directory (/workspace) read-write, the agent's
#     own home read-write, system paths read-only. The host filesystem is not
#     visible at all (container boundary + Landlock inside).
#   - Network: default-deny. Read-only HTTPS (GET/HEAD/OPTIONS only) to a
#     curated list of common dev/doc domains. Anything else is denied and
#     generates a policy proposal (sandboxes are created with
#     --approval-mode auto: proposals with an empty prover delta self-approve).
#   - The enmaas LLM endpoint is NOT listed here: it is authorized by the
#     attached provider profile (enmaas.yaml), which composes into the
#     effective policy automatically.

version: 1

filesystem_policy:
  include_workdir: true          # /workspace (image WORKDIR) becomes read-write
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /proc
    - /dev/urandom
    - /opt
  read_write:
    - /tmp
    - /home/goose               # Go caches (GOPATH/GOCACHE) and go-installed tools

landlock:
  compatibility: best_effort

network_policies:
  web_read_common:
    endpoints:
      # GitHub — code, API, raw content, gists
      - host: github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.github.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.githubusercontent.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Python package index
      - host: pypi.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.pypi.org"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.pythonhosted.org"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Node package registry
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.npmjs.org"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Go
      - host: "**.golang.org"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "go.dev"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.googleapis.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Rust crates
      - host: crates.io
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.crates.io"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Q&A and reference
      - host: "**.stackoverflow.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.wikipedia.org"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Corporate and docs
      - host: "**.redhat.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.nvidia.com"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: goose-docs.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.goose-docs.ai"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Model hub
      - host: huggingface.co
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: "**.hf.co"
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      # Smoke-test target
      - host: example.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/goose   # covers the agent and processes it starts
      - path: /usr/local/go/bin/go   # go: module downloads, `go install` codegen tools
      - path: /usr/bin/curl
      - path: /usr/bin/git
      - path: /usr/bin/python3       # Fedora 44: python3 -> python3.14 (ubuntu:24.04 had python3.12)
      - path: /usr/bin/python3.14
      - path: /usr/bin/node          # distro node (kept in case of revert)
      - path: /usr/local/bin/node    # node from the nodejs.org tarball (npm/npx run under it)
